name: Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run secret scanning
        id: secret_scan
        run: |
          # Create a temporary secret scanning script with whitelisting
          cat > secret-scan.js << 'EOF'
          #!/usr/bin/env node

          const fs = require('fs');
          const path = require('path');

          // Secret patterns to detect
          const SECRET_PATTERNS = [
            { id: 'S01', name: 'AWS_ACCESS_KEY', severity: 'critical', pattern: /(?:AKIA|ASIA)[A-Z0-9]{16}/g },
            { id: 'S02', name: 'AWS_SECRET_KEY', severity: 'critical', pattern: /aws.{0,20}(?:secret|access).{0,20}['"][A-Za-z0-9\/+=]{40}['"]/gi },
            { id: 'S03', name: 'GITHUB_TOKEN', severity: 'critical', pattern: /(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,}/g },
            { id: 'S04', name: 'GITLAB_TOKEN', severity: 'critical', pattern: /glpat-[A-Za-z0-9\-_]{20,}/g },
            { id: 'S05', name: 'SLACK_TOKEN', severity: 'high', pattern: /xox[baprs]-[A-Za-z0-9\-]{10,}/g },
            { id: 'S06', name: 'JWT_TOKEN', severity: 'high', pattern: /eyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+/g },
            { id: 'S07', name: 'PRIVATE_KEY', severity: 'critical', pattern: /-----BEGIN\s+(?:RSA|EC|DSA|OPENSSH|PGP)\s+PRIVATE\s+KEY-----/g },
            { id: 'S08', name: 'CONNECTION_STRING', severity: 'high', pattern: /(?:mongodb|postgresql|mysql|redis):\/\/[^\s'"]{8,}@/gi },
            { id: 'S09', name: 'PASSWORD_IN_CODE', severity: 'high', pattern: /(?:password|passwd|pwd)\s*[:=]\s*['\"][^'\"]{6,}['\"]/gi },
            { id: 'S10', name: 'API_KEY_IN_CODE', severity: 'high', pattern: /(?:api[_-]?key|apikey)\s*[:=]\s*['\"][A-Za-z0-9_\-]{16,}['\"]/gi },
            { id: 'S11', name: 'SECRET_IN_ENV', severity: 'medium', pattern: /(?:SECRET|TOKEN|PASSWORD|CREDENTIALS)\s*=\s*['\"][^'\"]+['\"]/g },
            { id: 'S12', name: 'NPM_TOKEN', severity: 'critical', pattern: /\/\/registry\.npmjs\.org\/:_authToken=[A-Za-z0-9\-]{36,}/g },
            { id: 'S13', name: 'HEROKU_API_KEY', severity: 'high', pattern: /heroku.{0,10}[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}/gi },
            { id: 'S14', name: 'GOOGLE_SERVICE_JSON', severity: 'high', pattern: /"type":\s*"service_account"/g },
            { id: 'S15', name: 'DOCKER_CONFIG_AUTH', severity: 'high', pattern: /"auth":\s*"[A-Za-z0-9+\/=]{20,}"/g },
            { id: 'S16', name: 'STRIPE_API_KEY', severity: 'critical', pattern: /(?:sk_live|pk_live|sk_test|pk_test)_[A-Za-z0-9]{24,}/g },
            { id: 'S17', name: 'TELEGRAM_BOT_TOKEN', severity: 'critical', pattern: /[1-9]\d{8,10}:AA[A-Za-z0-9_\-]{33,35}/g },
            { id: 'S18', name: 'SLACK_WEBHOOK', severity: 'high', pattern: /https:\/\/hooks\.slack\.com\/services\/[A-Za-z0-9\/]{40,}/g },
            { id: 'S19', name: 'GENERIC_BEARER', severity: 'medium', pattern: /(?:bearer|token)\s+[A-Za-z0-9_\-\.]{20,}/gi },
          ];

          // Whitelist patterns for demo/documentation strings that should NOT trigger alerts
          const WHITELIST_PATTERNS = [
            // OpenSSH private key demo patterns (common in documentation/playgrounds)
            /-----BEGIN\s+OPENSSH\s+PRIVATE\s+KEY-----/,
            // Demo AWS keys
            /AKIA[IOS]\w{16}/,  # Common AWS key patterns in docs
            /aws.{0,20}(?:secret|access).{0,20}['"]AKIA[IOS]\w{16}['"]/gi,
            // GitHub token demo patterns
            /ghp_[A-Za-z0-9_]{36,}/,  # GitHub personal token pattern
            // Generic demo indicators
            /demo|example|test|fake|dummy|placeholder/i,
            // Documentation-specific paths
            /\/(docs|documentation|README|playground|samples?|examples?)\//i,
            // Specific file names that often contain demo secrets
            /(demo|example|test|sample|fixture)\.(md|txt|json|ya?ml|js|ts|html?)$/i
          ];

          function loadIgnoreFile() {
            const ignoreFile = path.join(process.cwd(), '.secret-scan-ignore');
            if (!fs.existsSync(ignoreFile)) return [];
            return fs.readFileSync(ignoreFile, 'utf8')
              .split('\n')
              .map(l => l.trim())
              .filter(l => l && !l.startsWith('#'));
          }

          function isWhitelisted(content, filePath) {
            // Check if content matches any whitelist pattern
            for (const pattern of WHITELIST_PATTERNS) {
              if (pattern.test(content)) {
                return true;
              }
            }

            // Check if file path matches whitelist patterns
            const normalizedPath = filePath.replace(/\\/g, '/');
            for (const pattern of WHITELIST_PATTERNS) {
              if (pattern.test(normalizedPath)) {
                return true;
              }
            }

            // Check ignore file
            const ignoredPatterns = loadIgnoreFile();
            for (const pattern of ignoredPatterns) {
              if (normalizedPath.includes(pattern)) {
                return true;
              }
            }

            return false;
          }

          function scanFile(filePath) {
            try {
              const content = fs.readFileSync(filePath, 'utf8');

              // Skip if whitelisted
              if (isWhitelisted(content, filePath)) {
                return [];
              }

              const findings = [];
              for (const rule of SECRET_PATTERNS) {
                const matches = content.match(rule.pattern);
                if (matches) {
                  // For each match, check if it's whitelisted in context
                  const lines = content.split('\n');
                  const matchDetails = [];

                  for (const match of matches) {
                    // Find line number of this match
                    let lineNum = 0;
                    let found = false;
                    for (let i = 0; i < lines.length; i++) {
                      if (lines[i].includes(match)) {
                        lineNum = i + 1;
                        found = true;
                        break;
                      }
                    }

                    if (found) {
                      // Extract context around the match (5 lines before and after)
                      const start = Math.max(0, lineNum - 6);
                      const end = Math.min(lines.length, lineNum + 5);
                      const contextLines = lines.slice(start, end);
                      const context = contextLines.join('\n');

                      // Double-check if this specific match is whitelisted in context
                      if (!isWhitelisted(context, `${filePath}:${lineNum}`)) {
                        matchDetails.push({
                          line: lineNum,
                          snippet: match.substring(0, Math.min(100, match.length)),
                          count: 1
                        });
                      }
                    }
                  }

                  if (matchDetails.length > 0) {
                    findings.push({
                      rule: rule.id,
                      name: rule.name,
                      severity: rule.severity,
                      count: matchDetails.length,
                      matches: matchDetails
                    });
                  }
                }
              }

              return findings;
            } catch (err) {
              // Skip unreadable files
              return [];
            }
          }

          function collectFiles(dir) {
            const files = [];
            const excludeDirs = new Set(['node_modules', '.git', '.github', 'dist', 'build', 'coverage']);

            function walk(currentDir) {
              try {
                const entries = fs.readdirSync(currentDir, { withFileTypes: true });
                for (const entry of entries) {
                  if (entry.name.startsWith('.')) continue;

                  const fullPath = path.join(currentDir, entry.name);

                  if (entry.isDirectory()) {
                    if (!excludeDirs.has(entry.name)) {
                      walk(fullPath);
                    }
                  } else {
                    files.push(fullPath);
                  }
                }
              } catch (err) {
                // Skip directories we can't read
              }
            }

            walk(dir);
            return files;
          }

          async function main() {
            const target = process.argv[2] || '.';
            const failOnWarn = process.argv.includes('--fail-on-warn');

            if (!fs.existsSync(target)) {
              console.error(`Error: path "${target}" does not exist`);
              process.exit(1);
            }

            const files = collectFiles(target);
            console.log(`Scanning ${files.length} files for secrets...`);

            let allFindings = [];
            let maxSeverity = 'none';
            const severityOrder = { none: 0, low: 1, medium: 2, high: 3, critical: 4 };

            for (const file of files) {
              try {
                const findings = scanFile(file);
                if (findings.length > 0) {
                  allFindings.push({ file, secrets: findings });
                  for (const finding of findings) {
                    if (severityOrder[finding.severity] > severityOrder[maxSeverity]) {
                      maxSeverity = finding.severity;
                    }
                  }
                }
              } catch (err) {
                console.error(`Error scanning ${file}: ${err.message}`);
              }
            }

            // Output results
            if (process.argv.includes('--json')) {
              console.log(JSON.stringify({
                verdict: maxSeverity === 'critical' ? 'BLOCK' : maxSeverity === 'high' ? 'WARN' : 'ALLOW',
                maxSeverity,
                filesScanned: files.length,
                secretsFound: allFindings.length,
                findings: allFindings,
              }, null, 2));
            } else {
              console.log('\n=== Secret Scan Results ===');
              console.log(`Files scanned: ${files.length}`);
              console.log(`Secrets found: ${allFindings.length}`);

              if (allFindings.length > 0) {
                console.log('\n--- Findings ---');
                for (const entry of allFindings) {
                  console.log(`\n📁 ${entry.file}`);
                  for (const secret of entry.secrets) {
                    const icon = secret.severity === 'critical' ? '🔴' :
                              secret.severity === 'high' ? '🟠' : '🟡';
                    console.log(`  ${icon} ${secret.rule} (${secret.name}) - ${secret.severity}`);
                    console.log(`     Found ${secret.count} time(s)`);
                    for (const match of secret.matches.slice(0, 3)) { // Show first 3 matches
                      console.log(`     Line ${match.line}: ${match.snippet}${match.snippet.length >= 100 ? '...' : ''}`);
                    }
                    if (secret.matches.length > 3) {
                      console.log(`     ... and ${secret.matches.length - 3} more`);
                    }
                  }
                }
              }

              console.log(`\n=== Summary ===");
              console.log(`Max severity: ${maxSeverity}`);
              console.log(`Verdict: ${maxSeverity === 'critical' ? 'BLOCK' : maxSeverity === 'high' ? 'WARN' : 'ALLOW'}`);
            }

            // Set exit code based on findings
            if (maxSeverity === 'critical') {
              process.exit(2);  # Blocking failure
            } else if (maxSeverity === 'high' && failOnWarn) {
              process.exit(1);  # Warning failure
            } else {
              process.exit(0);  # Success
            }
          }

          main().catch(err => {
            console.error('Fatal error:', err.message);
            process.exit(1);
          });
          EOF

          chmod +x secret-scan.js

          # Run the scanner
          node secret-scan.js --json > scan-results.json

          # Output results for debugging
          cat scan-results.json

          # Set outputs for conditional steps
          VERDICT=$(jq -r '.verdict' scan-results.json)
          MAX_SEVERITY=$(jq -r '.maxSeverity' scan-results.json)
          SECRETS_FOUND=$(jq -r '.secretsFound' scan-results.json)

          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT
          echo "max_severity=$MAX_SEVERITY" >> $GITHUB_OUTPUT
          echo "secrets_found=$SECRETS_FOUND" >> $GITHUB_OUTPUT

          # Exit with appropriate code
          if [ "$VERDICT" = "BLOCK" ]; then
            exit 2
          elif [ "$VERDICT" = "WARN" ] && [ "${{ secrets.SECRET_SCAN_FAIL_ON_WARN }}" = "true" ]; then
            exit 1
          else
            exit 0
          fi

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: scan-results.json
          retention-days: 30

      - name: Create issue for critical secrets
        if: steps.secret_scan.outputs.verdict == 'BLOCK'
        uses: actions/github-sdk@v0
        with:
          script: |
            const { github, context } = require('@actions/github');
            const fs = require('fs');

            // Read scan results
            const results = JSON.parse(fs.readFileSync('scan-results.json', 'utf8'));

            // Create issue title
            const title = `🚨 CRITICAL: Secret scanning detected ${results.secretsFound} potential secret(s)`;

            // Create issue body
            let body = `## Secret Scan Results\n\n`;
            body += `**Verdict:** BLOCKING - Critical secrets detected\n`;
            body += `**Files scanned:** ${results.filesScanned}\n`;
            body += `**Secrets found:** ${results.secretsFound}\n\n`;

            body += `### Details\n\n`;
            for (const finding of results.findings) {
              body += `#### ${finding.file}\n`;
              for (const secret of finding.secrets) {
                body += `- **${secret.rule}** (${secret.name}): ${secret.severity} severity\n`;
                body += `  - Found ${secret.count} time(s)\n`;
                for (const match of secret.matches.slice(0, 3)) {
                  body += `  - Line ${match.line}: \`${match.snippet}\`\n`;
                }
                if (secret.matches.length > 3) {
                  body += `  - ... and ${secret.matches.length - 3} more matches\n`;
                }
                body += `\n`;
              }
            }

            body += `---\n*This issue was automatically generated by the secret scanning workflow.*\n";

            // Create the issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'secret-scan', 'critical']
            });

      - name: Create issue for high-severity secrets
        if: steps.secret_scan.outputs.verdict == 'WARN'
        uses: actions/github-sdk@v0
        with:
          script: |
            const { github, context } = require('@actions/github');
            const fs = require('fs');

            // Only create issue if configured to fail on warnings
            if (process.env.SECRET_SCAN_FAIL_ON_WARN !== 'true') {
              console.log("Not creating issue for WARN verdict (fail-on-warn not enabled)");
              return;
            }

            // Read scan results
            const results = JSON.parse(fs.readFileSync('scan-results.json', 'utf8'));

            // Create issue title
            const title = `⚠️ WARNING: Secret scanning detected ${results.secretsFound} potential secret(s)`;

            // Create issue body
            let body = `## Secret Scan Results\n\n`;
            body += `**Verdict:** WARNING - High severity secrets detected\n`;
            body += `**Files scanned:** ${results.filesScanned}\n`;
            body += `**Secrets found:** ${results.secretsFound}\n\n`;

            body += `### Details\n\n`;
            for (const finding of results.findings) {
              body += `#### ${finding.file}\n`;
              for (const secret of finding.secrets) {
                body += `- **${secret.rule}** (${secret.name}): ${secret.severity} severity\n`;
                body += `  - Found ${secret.count} time(s)\n`;
                for (const match of secret.matches.slice(0, 3)) {
                  body += `  - Line ${match.line}: \`${match.snippet}\`\n`;
                }
                if (secret.matches.length > 3) {
                  body += `  - ... and ${secret.matches.length - 3} more matches\n`;
                }
                body += `\n`;
              }
            }

            body += `---\n*This issue was automatically generated by the secret scanning workflow.*\n";

            // Create the issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'secret-scan', 'warning']
            });

      - name: Alert on new secret findings (outside demo files)
        if: steps.secret_scan.outputs.secrets_found > 0
        uses: actions/github-sdk@v0
        with:
          script: |
            const { github, context } = require('@actions/github');
            const fs = require('fs');

            // Read scan results
            const results = JSON.parse(fs.readFileSync('scan-results.json', 'utf8'));

            // Filter out findings that are likely demo/documentation
            const NonDemoFindings = results.findings.flatMap(finding =>
              finding.secrets.filter(secret => {
                // Check if this finding is in a demo/documentation context
                const isLikelyDemo =
                  finding.file.match(/(docs|documentation|README|playground|samples?|examples?)\//i) ||
                  finding.file.match(/\.(md|txt)$/i) ||
                  finding.file.match(/(demo|example|test|sample|fixture)\./i);

                // Return true if this is NOT likely a demo finding
                return !isLikelyDemo;
              })
            );

            // Only alert if we have non-demo findings
            if (NonDemoFindings.length > 0) {
              console.log(`Found ${NonDemoFindings.length} non-demo secret findings - creating alert`);

              // Create issue for non-demo secrets
              const title = `🚨 ALERT: Potential real secrets detected outside demo/files`;

              let body = `## Secret Scan Alert - Non-Demo Findings\n\n`;
              body += `This alert is triggered because potential secrets were found outside of documented demo/files.\n`;
              body += `Please review immediately as these may represent real security risks.\n\n`;
              body += `**Files scanned:** ${results.filesScanned}\n`;
              body += `**Total secrets found:** ${results.secretsFound}\n`;
              body += `**Non-demo secrets found:** ${NonDemoFindings.reduce((sum, f) => sum + f.secrets.length, 0)}\n\n`;

              body += `### Non-Demo Findings Requiring Review\n\n`;
              for (const finding of NonDemoFindings) {
                body += `#### ${finding.file}\n`;
                for (const secret of finding.secrets) {
                  body += `- **${secret.rule}** (${secret.name}): ${secret.severity} severity\n`;
                  body += `  - Found ${secret.count} time(s)\n`;
                  for (const match of secret.matches.slice(0, 3)) {
                    body += `  - Line ${match.line}: \`${match.snippet}\`\n`;
                  }
                  if (secret.matches.length > 3) {
                    body += `  - ... and ${secret.matches.length - 3} more matches\n`;
                  }
                  body += `\n`;
                }
              }

              body += `---\n*This alert was automatically generated by the secret scanning workflow.*\n";

              // Check if similar issue already exists open
              const existingIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'security-alert'
              });

              // If no existing open security alert, create one
              if (existingIssues.data.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['security', 'secret-scan', 'alert', 'security-alert']
                });
                console.log("Created security alert issue");
              } else {
                console.log("Security alert issue already exists open");
              }
            } else {
              console.log("All findings appear to be demo/documentation - no alert needed");
            }