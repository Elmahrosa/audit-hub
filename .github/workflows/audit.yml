name: audit-aggregate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  AUDIT_HUB_ORG: Elmahrosa
  AUDIT_HUB_PAT: ${{ secrets.AUDIT_HUB_PAT || github.token }}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Aggregate audit data
        run: node scripts/aggregate.mjs

      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/data || true
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit"
            exit 0
          fi
          git commit -m "chore: refresh audit-hub data [skip ci]"
          git push "https://x-access-token:${AUDIT_HUB_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "Committed and pushed refreshed audit data"
