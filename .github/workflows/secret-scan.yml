name: Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

permissions:
  contents: read
  issues: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      SECRET_SCAN_FAIL_ON_WARN: ${{ vars.SECRET_SCAN_FAIL_ON_WARN || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run secret scanning
        id: secret_scan
        run: |
          set -uo pipefail
          SCAN_STATUS=0
          node scripts/secret-scan.js --json > scan-results.json || SCAN_STATUS=$?
          cat scan-results.json

          VERDICT=$(node -e "process.stdout.write(String(require('./scan-results.json').verdict))")
          MAX_SEVERITY=$(node -e "process.stdout.write(String(require('./scan-results.json').maxSeverity))")
          SECRETS_FOUND=$(node -e "process.stdout.write(String(require('./scan-results.json').secretsFound))")

          {
            echo "verdict=$VERDICT"
            echo "max_severity=$MAX_SEVERITY"
            echo "secrets_found=$SECRETS_FOUND"
            echo "scan_status=$SCAN_STATUS"
          } >> "$GITHUB_OUTPUT"

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-results
          path: scan-results.json
          retention-days: 30

      - name: Create issue for critical secrets
        if: steps.secret_scan.outputs.verdict == 'BLOCK'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('scan-results.json', 'utf8'));

            let body = '## Secret Scan Results\n\n';
            body += `**Verdict:** BLOCKING - critical secrets detected\n`;
            body += `**Files scanned:** ${results.filesScanned}\n`;
            body += `**Secrets found:** ${results.secretsFound}\n\n`;
            body += '### Details\n\n';

            for (const finding of results.findings) {
              body += `#### ${finding.file}\n`;
              for (const secret of finding.secrets) {
                body += `- **${secret.rule}** (${secret.name}): ${secret.severity} severity\n`;
                body += `  - Found ${secret.count} time(s)\n`;
                for (const match of secret.matches.slice(0, 3)) {
                  body += `  - Line ${match.line}: \`${match.snippet}\`\n`;
                }
                if (secret.matches.length > 3) {
                  body += `  - ... and ${secret.matches.length - 3} more matches\n`;
                }
                body += '\n';
              }
            }

            body += '---\n*This issue was automatically generated by the secret scanning workflow. Matched values are redacted.*\n';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CRITICAL: secret scanning detected ${results.secretsFound} potential secret(s)`,
              body,
              labels: ['security', 'secret-scan', 'critical'],
            });

      - name: Create issue for high-severity secrets
        if: steps.secret_scan.outputs.verdict == 'WARN' && env.SECRET_SCAN_FAIL_ON_WARN == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('scan-results.json', 'utf8'));

            let body = '## Secret Scan Results\n\n';
            body += `**Verdict:** WARNING - high severity secrets detected\n`;
            body += `**Files scanned:** ${results.filesScanned}\n`;
            body += `**Secrets found:** ${results.secretsFound}\n\n`;
            body += '### Details\n\n';

            for (const finding of results.findings) {
              body += `#### ${finding.file}\n`;
              for (const secret of finding.secrets) {
                body += `- **${secret.rule}** (${secret.name}): ${secret.severity} severity\n`;
                body += `  - Found ${secret.count} time(s)\n`;
                for (const match of secret.matches.slice(0, 3)) {
                  body += `  - Line ${match.line}: \`${match.snippet}\`\n`;
                }
                if (secret.matches.length > 3) {
                  body += `  - ... and ${secret.matches.length - 3} more matches\n`;
                }
                body += '\n';
              }
            }

            body += '---\n*This issue was automatically generated by the secret scanning workflow. Matched values are redacted.*\n';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `WARNING: secret scanning detected ${results.secretsFound} potential secret(s)`,
              body,
              labels: ['security', 'secret-scan', 'warning'],
            });
